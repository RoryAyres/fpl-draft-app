<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FPL Draft Live</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0fdf4', 500: '#10b981', 600: '#059669', 700: '#047857' },
                        gray: { 750: '#2d3748' }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .loader { border-top-color: #10b981; animation: spinner 0.8s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .active-tab { border-bottom: 2px solid #10b981; color: #10b981; font-weight: 700; }
        .arrow-up { color: #10b981; } 
        .arrow-down { color: #ef4444; } 
        #ptr-element { transition: transform 0.2s ease, opacity 0.2s ease; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col overflow-hidden select-none">

    <div id="ptr-element" class="absolute top-0 inset-x-0 h-14 flex items-center justify-center bg-gray-800 text-gray-400 text-xs font-semibold z-50 transform -translate-y-full opacity-0 shadow-inner">
        <svg id="ptr-icon" class="w-5 h-5 mr-2 animate-spin text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        <span id="ptr-text">Pull down to refresh...</span>
    </div>

    <header class="bg-gray-800/90 backdrop-blur-md border-b border-gray-700/60 z-20 sticky top-0">
        <div class="max-w-4xl mx-auto px-3 py-2.5 flex justify-between items-center">
            <h1 class="text-base font-extrabold text-white tracking-tight flex items-center">
                <svg class="w-5 h-5 mr-1.5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                FPL Draft Live
            </h1>
            
            <div class="flex items-center space-x-2">
                <button onclick="API.refreshData(true)" class="p-1.5 bg-gray-700/50 hover:bg-gray-700 rounded-full text-gray-300 hover:text-white transition-colors active:scale-95" title="Refresh Data">
                    <svg id="refresh-icon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                </button>

                <div class="text-xs font-medium bg-gray-900/60 px-2.5 py-1 rounded-full text-gray-300 border border-gray-700/50 flex items-center space-x-1.5">
                    <span class="truncate max-w-[100px]" id="league-name-display">Loading...</span>
                    <span id="header-gw-status" class="border-l border-gray-700 pl-1.5 text-emerald-400 font-bold hidden"></span>
                    <span id="live-indicator" class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse hidden" title="Connected"></span>
                    <span id="mock-indicator" class="w-2 h-2 rounded-full bg-amber-400 hidden" title="Mock Mode"></span>
                </div>
            </div>
        </div>
        
        <nav class="max-w-4xl mx-auto px-3 flex overflow-x-auto no-scrollbar border-t border-gray-700/40">
            <button onclick="UI.switchTab('my-team')" id="tab-my-team" class="active-tab whitespace-nowrap py-2.5 px-4 text-xs font-semibold tracking-wide transition-colors">My Team</button>
            <button onclick="UI.switchTab('fixtures')" id="tab-fixtures" class="whitespace-nowrap py-2.5 px-4 text-xs font-semibold text-gray-400 tracking-wide transition-colors hover:text-gray-200">Live Fixtures</button>
            <button onclick="UI.switchTab('table')" id="tab-table" class="whitespace-nowrap py-2.5 px-4 text-xs font-semibold text-gray-400 tracking-wide transition-colors hover:text-gray-200">Live Table</button>
        </nav>
    </header>

    <main id="main-scroll-container" class="flex-grow overflow-y-auto relative bg-gray-900 pb-16">
        <div id="loading-overlay" class="absolute inset-0 bg-gray-900 bg-opacity-95 flex flex-col items-center justify-center z-50">
            <div class="loader ease-linear rounded-full border-3 border-t-3 border-gray-700 h-10 w-10 mb-3"></div>
            <h2 class="text-center text-gray-300 text-xs font-medium" id="loading-text">Fetching live data...</h2>
            <p class="text-[10px] text-gray-500 mt-1 max-w-xs text-center px-4" id="loading-subtext"></p>
        </div>

        <div class="max-w-4xl mx-auto px-2.5 py-3">
            
            <div id="content-my-team" class="tab-content hidden space-y-3">
                <div class="bg-gray-800/90 rounded-xl shadow-lg border border-gray-700/60 overflow-hidden">
                    <div class="bg-gradient-to-r from-emerald-800 to-emerald-600 px-3.5 py-2.5 flex justify-between items-center text-white">
                        <div class="min-w-0 flex-1 mr-2">
                            <div class="relative inline-flex items-center max-w-full">
                                <select id="team-selector" onchange="UI.changeTeam(this.value)" class="text-sm font-extrabold bg-transparent text-white border-b border-emerald-300/40 hover:border-white focus:outline-none py-0.5 pr-5 cursor-pointer appearance-none truncate w-full">
                                    <option class="text-gray-900" value="">Loading...</option>
                                </select>
                                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center text-emerald-200">
                                    <svg class="fill-current h-4 w-4" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                                </div>
                            </div>
                            <p class="text-emerald-100 text-[11px] font-medium truncate mt-0.5" id="my-manager-name">Manager</p>
                        </div>
                        <div class="text-right flex-shrink-0 bg-black/20 px-2.5 py-1 rounded-lg border border-white/10">
                            <div class="text-xl font-black leading-tight" id="my-team-points">0</div>
                            <div class="text-emerald-200 text-[9px] uppercase tracking-wider font-bold">GW Pts</div>
                        </div>
                    </div>

                    <div class="p-0">
                        <div class="flex border-b border-gray-700/50 text-[10px] font-bold text-gray-400 uppercase tracking-wider bg-gray-800/50 px-3 py-1.5">
                            <div class="w-8 text-center">Pos</div>
                            <div class="flex-grow pl-1.5">Player / Events</div>
                            <div class="w-20 text-center">Fixture</div>
                            <div class="w-12 text-right">Pts</div>
                        </div>
                        <div id="my-team-players-list" class="divide-y divide-gray-700/40"></div>
                    </div>
                </div>
            </div>

            <div id="content-fixtures" class="tab-content hidden space-y-2.5">
                <div id="fixtures-list" class="space-y-2 mt-1"></div>
            </div>

            <div id="content-table" class="tab-content hidden space-y-2.5">
                <h2 class="text-sm font-bold text-gray-200 px-1 mb-1">Live Standings</h2>
                <div class="bg-gray-800/90 rounded-xl shadow-lg border border-gray-700/60 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-xs text-left">
                            <thead id="live-table-head" class="text-[10px] text-gray-400 uppercase bg-gray-800/80 border-b border-gray-700/60">
                            </thead>
                            <tbody id="live-table-body" class="divide-y divide-gray-700/40"></tbody>
                        </table>
                    </div>
                </div>
            </div>
            
            <div id="error-message" class="hidden mt-3 bg-red-900/40 border border-red-700/60 text-red-300 px-3 py-2.5 rounded-lg text-xs relative shadow-lg" role="alert">
                <strong class="font-bold">Notice:</strong>
                <span class="block sm:inline" id="error-text">Something went wrong.</span>
            </div>
        </div>
    </main>

    <script>
        const CONFIG = {
            LEAGUE_ID: 238,
            PROXY_URL: 'https://fpl-draft-app-iota.vercel.app/api/proxy?path=' 
        };

        const State = {
            isUsingMockData: false,
            bootstrapStatic: null,
            leagueDetails: null,
            currentGW: null,
            liveScores: null,
            plFixtures: [],
            entries: {}, 
            teamEvents: {}, 
            myTeamId: null, 
            teamsData: {},
            
            getStaticPlayer: (id) => State.bootstrapStatic?.elements.find(e => e.id === id) || {},
            getLiveStats: (id) => State.liveScores?.elements[id]?.stats || {},
            getLivePoints: (id) => State.liveScores?.elements[id]?.stats?.total_points || 0,
            getLiveMinutes: (id) => State.liveScores?.elements[id]?.stats?.minutes || 0,
        };

        const UI = {
            showLoading: (text, subtext = '') => {
                document.getElementById('loading-overlay').classList.remove('hidden');
                if (text) document.getElementById('loading-text').innerText = text;
                document.getElementById('loading-subtext').innerText = subtext;
            },
            hideLoading: () => document.getElementById('loading-overlay').classList.add('hidden'),
            showError: (msg) => {
                document.getElementById('error-text').innerText = msg;
                document.getElementById('error-message').classList.remove('hidden');
            },
            switchTab: (tabId) => {
                document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
                document.querySelectorAll('nav button').forEach(el => {
                    el.classList.remove('active-tab', 'text-emerald-400');
                    el.classList.add('text-gray-400');
                });
                document.getElementById(`content-${tabId}`).classList.remove('hidden');
                const activeBtn = document.getElementById(`tab-${tabId}`);
                activeBtn.classList.add('active-tab', 'text-emerald-400');
                activeBtn.classList.remove('text-gray-400');
                Render.currentTab();
            },
            changeTeam: (teamId) => {
                State.myTeamId = parseInt(teamId);
                Render.myTeam();
                if (!document.getElementById('content-table').classList.contains('hidden')) {
                    Render.liveTable();
                }
            },
            getPosClass: (posId) => {
                const map = { 1: 'bg-amber-900/50 text-amber-300 border-amber-700/50', 2: 'bg-blue-900/50 text-blue-300 border-blue-700/50', 3: 'bg-emerald-900/50 text-emerald-300 border-emerald-700/50', 4: 'bg-rose-900/50 text-rose-300 border-rose-700/50' };
                return map[posId] || 'bg-gray-800 text-gray-300 border-gray-700';
            },
            getPosName: (posId) => ({ 1: 'GKP', 2: 'DEF', 3: 'MID', 4: 'FWD' }[posId] || 'UNK'),
            
            formatStatBadges: (stats) => {
                if (!stats) return '';
                let badges = [];
                const goals = stats.goals_scored || 0;
                const assists = stats.assists || 0;
                const cleanSheets = stats.clean_sheets || 0;
                const yellowCards = stats.yellow_cards || 0;
                const redCards = stats.red_cards || 0;
                const ownGoals = stats.own_goals || 0;
                const penaltiesSaved = stats.penalties_saved || 0;
                const penaltiesMissed = stats.penalties_missed || 0;
                const saves = stats.saves || 0;
                const bonus = stats.bonus || 0;
                
                const savePoints = Math.floor(saves / 3);

                for(let i=0; i<goals; i++) badges.push('⚽');
                for(let i=0; i<assists; i++) badges.push('👟'); 
                for(let i=0; i<cleanSheets; i++) badges.push('🛡️');
                for(let i=0; i<penaltiesSaved; i++) badges.push('🧤');
                for(let i=0; i<savePoints; i++) badges.push('👐');
                for(let i=0; i<yellowCards; i++) badges.push('🟨');
                for(let i=0; i<redCards; i++) badges.push('🟥');
                for(let i=0; i<penaltiesMissed; i++) badges.push('❌');
                for(let i=0; i<ownGoals; i++) badges.push('⚠️');
                for(let i=0; i<bonus; i++) badges.push('✨');

                if (badges.length === 0) return '';
                return `<span class="inline-flex items-center space-x-0.5 mx-1 text-[11px]">${badges.join('')}</span>`;
            }
        };

        const API = {
            fetchVercelProxy: async (endpoint) => {
                const fetchUrl = `${CONFIG.PROXY_URL}${encodeURI(endpoint)}`;
                const response = await fetch(fetchUrl);
                if (!response.ok) {
                    let errBody = '';
                    try {
                        const errJson = await response.json();
                        errBody = errJson.error || JSON.stringify(errJson);
                    } catch(e) {
                        errBody = await response.text();
                    }
                    throw new Error(`Endpoint '${endpoint}' failed with status ${response.status}.`);
                }
                return await response.json();
            },
            
            refreshData: async (manual = false) => {
                try {
                    if (manual) {
                        const icon = document.getElementById('refresh-icon');
                        icon.classList.add('animate-spin');
                    }
                    State.bootstrapStatic = await API.fetchVercelProxy('bootstrap-static');
                    State.leagueDetails = await API.fetchVercelProxy(`league/${CONFIG.LEAGUE_ID}/details`);
                    State.liveScores = await API.fetchVercelProxy(`event/${State.currentGW}/live`);
                    State.plFixtures = await API.fetchVercelProxy(`fixtures/?event=${State.currentGW}`);

                    for (const entry of State.leagueDetails.league_entries) {
                        try {
                            const teamData = await API.fetchVercelProxy(`entry/${entry.entry_id}/event/${State.currentGW}`);
                            State.teamEvents[entry.entry_id] = teamData;
                        } catch (err) {}
                    }

                    State.leagueDetails.league_entries.forEach(entry => {
                        const lineup = State.teamEvents[entry.entry_id];
                        let total = 0;
                        if(lineup && lineup.picks) {
                            lineup.picks.forEach(p => { if (p.position <= 11) total += State.getLivePoints(p.element); });
                        }
                        if (State.entries[entry.id]) {
                            State.entries[entry.id].livePoints = total;
                        }
                    });

                    Render.currentTab();
                    if (manual) {
                        setTimeout(() => document.getElementById('refresh-icon').classList.remove('animate-spin'), 500);
                    }
                } catch (e) {
                    console.error("Background refresh failed:", e);
                    if (manual) document.getElementById('refresh-icon').classList.remove('animate-spin');
                }
            },
            
            init: async () => {
                try {
                    UI.showLoading('Connecting to Premier League API...', `Loading League ID: ${CONFIG.LEAGUE_ID}`);
                    
                    try {
                        State.bootstrapStatic = await API.fetchVercelProxy('bootstrap-static');
                        State.leagueDetails = await API.fetchVercelProxy(`league/${CONFIG.LEAGUE_ID}/details`);
                        
                        try {
                            const gameStatus = await API.fetchVercelProxy('game');
                            State.currentGW = gameStatus.current_event || 1;
                        } catch (e) {
                            let eventsList = State.bootstrapStatic.events || [];
                            if (!Array.isArray(eventsList)) eventsList = Object.values(eventsList);
                            const currentEvent = eventsList.find(e => e.is_current) || eventsList.find(e => e.is_next);
                            State.currentGW = currentEvent ? currentEvent.id : 1;
                        }

                        State.liveScores = await API.fetchVercelProxy(`event/${State.currentGW}/live`);
                        State.plFixtures = await API.fetchVercelProxy(`fixtures/?event=${State.currentGW}`);

                        for (const entry of State.leagueDetails.league_entries) {
                            try {
                                const teamData = await API.fetchVercelProxy(`entry/${entry.entry_id}/event/${State.currentGW}`);
                                State.teamEvents[entry.entry_id] = teamData;
                            } catch (err) {}
                        }

                        document.getElementById('live-indicator').classList.remove('hidden');

                    } catch (proxyError) {
                        console.error("[FRONTEND] API Fetch Error:", proxyError);
                        UI.showError(`Error Fetching Data: ${proxyError.message}`);
                        await new Promise(r => setTimeout(r, 3000)); 
                        
                        State.isUsingMockData = true;
                        UI.showLoading('Loading Mock Data...', 'Previewing UI without live connection.');
                        document.getElementById('mock-indicator').classList.remove('hidden');
                        
                        State.bootstrapStatic = MockData.getBootstrap();
                        State.leagueDetails = MockData.getLeague();
                        State.currentGW = 1;
                        State.plFixtures = MockData.getPLFixtures();
                        State.liveScores = MockData.getLiveScores();
                        
                        State.leagueDetails.league_entries.forEach(entry => {
                            State.teamEvents[entry.entry_id] = MockData.getTeamEvent(entry.entry_id);
                        });
                    }

                    State.bootstrapStatic.teams.forEach(t => State.teamsData[t.id] = t);
                    document.getElementById('league-name-display').innerText = State.leagueDetails.league.name;
                    
                    const headerGwEl = document.getElementById('header-gw-status');
                    headerGwEl.innerText = `GW ${State.currentGW}`;
                    headerGwEl.classList.remove('hidden');
                    
                    State.leagueDetails.league_entries.forEach(entry => {
                        State.entries[entry.id] = { ...entry, livePoints: 0 };
                    });
                    
                    State.myTeamId = State.leagueDetails.league_entries[0]?.id;

                    const selector = document.getElementById('team-selector');
                    selector.innerHTML = '';
                    State.leagueDetails.league_entries.forEach(entry => {
                        const opt = document.createElement('option');
                        opt.value = entry.id;
                        opt.className = "text-gray-900 bg-gray-100";
                        opt.text = entry.entry_name;
                        selector.appendChild(opt);
                    });
                    selector.value = State.myTeamId;

                    State.leagueDetails.league_entries.forEach(entry => {
                        const lineup = State.teamEvents[entry.entry_id];
                        let total = 0;
                        if(lineup && lineup.picks) {
                            lineup.picks.forEach(p => { if (p.position <= 11) total += State.getLivePoints(p.element); });
                        }
                        State.entries[entry.id].livePoints = total;
                    });

                    UI.hideLoading();
                    UI.switchTab('my-team');
                    
                } catch (error) {
                    UI.showError("Critical initialisation error: " + error.message);
                    console.error(error);
                }
            }
        };

        const Render = {
            currentTab: () => {
                if (!State.leagueDetails) return;
                if (!document.getElementById('content-my-team').classList.contains('hidden')) Render.myTeam();
                if (!document.getElementById('content-fixtures').classList.contains('hidden')) Render.fixtures();
                if (!document.getElementById('content-table').classList.contains('hidden')) Render.liveTable();
            },
            
            getFixtureStatus: (teamId) => {
                const fixture = State.plFixtures.find(f => f.team_h === teamId || f.team_a === teamId);
                if (!fixture) return { opponent: 'TBD', status: 'Soon', isHome: null, colorClass: 'text-gray-400 bg-gray-800 border-gray-700' };
                const isHome = fixture.team_h === teamId;
                const oppTeam = State.teamsData[isHome ? fixture.team_a : fixture.team_h];
                const opponentName = oppTeam ? oppTeam.short_name : 'UNK';
                
                let status = 'Soon', colorClass = 'text-gray-400 bg-gray-800 border-gray-700';
                if (fixture.finished || fixture.finished_provisional || (fixture.started && fixture.minutes >= 90)) { 
                    status = 'FT'; colorClass = 'text-gray-400 bg-gray-800/80 border-gray-700'; 
                } 
                else if (fixture.started) { 
                    status = 'Live'; colorClass = 'text-emerald-400 bg-emerald-950/80 border-emerald-700/60 animate-pulse'; 
                }
                return { opponent: opponentName, isHome, status, colorClass };
            },

            myTeam: () => {
                const teamInfo = State.entries[State.myTeamId];
                const lineup = teamInfo ? State.teamEvents[teamInfo.entry_id] : null;
                
                if (!teamInfo || !lineup) return;

                const formattedName = teamInfo.player_first_name === "Rory" ? "Rory A" : `${teamInfo.player_first_name} ${teamInfo.player_last_name}`;

                document.getElementById('team-selector').value = teamInfo.id;
                document.getElementById('my-manager-name').innerText = formattedName;
                document.getElementById('my-team-points').innerText = teamInfo.livePoints;

                const listEl = document.getElementById('my-team-players-list');
                listEl.innerHTML = '';

                const buildPlayerRow = (pick, isBench) => {
                    const pStat = State.getStaticPlayer(pick.element);
                    const pts = State.getLivePoints(pick.element);
                    const mins = State.getLiveMinutes(pick.element);
                    const stats = State.getLiveStats(pick.element);
                    const t = State.teamsData[pStat.team];
                    const fix = Render.getFixtureStatus(pStat.team);
                    const statBadges = UI.formatStatBadges(stats);
                    
                    const isPlayed = fix.status === 'Live' || fix.status === 'FT';
                    const ptsColor = isPlayed ? 'text-emerald-400' : 'text-gray-100';
                    
                    const minBadge = (fix.status === 'Live' || fix.status === 'FT') 
                        ? `<span class="ml-1 px-1 py-0.5 rounded ${isBench ? 'bg-gray-800 text-gray-400' : 'bg-gray-800 text-gray-300'} font-medium text-[9px] border border-gray-700">${mins}'</span>` 
                        : '';
                    
                    return `
                        <div class="flex items-center px-3 py-2 ${isBench ? 'opacity-50 bg-gray-900/40' : 'hover:bg-gray-800/40 transition-colors'}">
                            <div class="w-8 text-center flex-shrink-0"><span class="text-[9px] font-bold px-1 py-0.5 rounded border ${UI.getPosClass(pStat.element_type)}">${UI.getPosName(pStat.element_type)}</span></div>
                            <div class="flex-grow pl-2 min-w-0 flex flex-col justify-center">
                                <div class="flex items-center space-x-0 truncate">
                                    <span class="text-xs font-semibold text-gray-100 truncate">${pStat.web_name || 'Unknown'}</span>
                                    ${statBadges}
                                </div>
                                <div class="flex items-center text-[10px] text-gray-400 mt-0.5"><span>${t ? t.short_name : ''}</span>${minBadge}</div>
                            </div>
                            <div class="w-20 text-center text-[11px] flex flex-col items-center flex-shrink-0">
                                <span class="font-medium text-gray-300">${fix.opponent} ${fix.isHome ? '(H)' : '(A)'}</span>
                                <span class="text-[9px] px-1.5 py-0.2 rounded border mt-0.5 ${fix.colorClass}">${fix.status}</span>
                            </div>
                            <div class="w-12 text-right flex-shrink-0"><span class="text-sm font-bold ${isBench ? 'text-gray-500' : ptsColor}">${pts}</span></div>
                        </div>`;
                };

                const starters = lineup.picks.filter(p => p.position <= 11)
                    .map(p => ({ pick: p, stat: State.getStaticPlayer(p.element) }))
                    .sort((a, b) => a.stat.element_type - b.stat.element_type);
                
                starters.forEach(item => listEl.innerHTML += buildPlayerRow(item.pick, false));

                listEl.innerHTML += `<div class="bg-gray-800/80 px-3 py-1.5 text-center text-[10px] font-bold text-gray-400 uppercase tracking-wider border-y border-gray-700/60 mt-1">Bench</div>`;

                const bench = lineup.picks.filter(p => p.position > 11).sort((a, b) => a.position - b.position);
                bench.forEach(pick => listEl.innerHTML += buildPlayerRow(pick, true));
            },

            fixtures: () => {
                const listEl = document.getElementById('fixtures-list');
                listEl.innerHTML = '';
                
                const h2hMatches = State.leagueDetails.matches ? State.leagueDetails.matches.filter(m => m.event == State.currentGW) : [];

                if (h2hMatches.length === 0) {
                    listEl.innerHTML = '<div class="text-center p-4 text-xs text-gray-400 bg-gray-800 rounded-xl border border-gray-700">No H2H fixtures found for this gameweek.</div>';
                    return;
                }

                const buildCondensedPlayer = (pick, isBench, isAway) => {
                    if (!pick) return '';
                    const pStat = State.getStaticPlayer(pick.element);
                    const pts = State.getLivePoints(pick.element);
                    const stats = State.getLiveStats(pick.element);
                    const mins = State.getLiveMinutes(pick.element);
                    const fix = Render.getFixtureStatus(pStat.team);
                    const statBadges = UI.formatStatBadges(stats);
                    
                    const isPlayed = fix.status === 'Live' || fix.status === 'FT';
                    const ptsColor = isPlayed ? 'text-emerald-400' : 'text-gray-100';

                    const statusInd = isPlayed 
                        ? `<span class="text-[8px] px-1 font-semibold ${fix.status === 'Live' ? 'text-emerald-400 animate-pulse' : 'text-gray-500'}">${fix.status === 'Live' ? mins + '\'' : 'FT'}</span>` 
                        : `<span class="text-[8px] px-1 font-semibold text-gray-600">Soon</span>`;
                    
                    if (isAway) {
                        return `
                        <div class="flex justify-between items-center py-1 border-b border-gray-700/40 ${isBench ? 'opacity-50' : ''}">
                            <div class="font-bold text-[11px] ${ptsColor} flex-shrink-0 w-4">${pts}</div>
                            <div class="flex items-center justify-end truncate min-w-0 pl-1 w-full">
                                ${statusInd}
                                ${statBadges}
                                <span class="text-[10px] font-semibold text-gray-200 truncate ml-1 mr-1.5">${pStat.web_name || 'Unknown'}</span>
                                <span class="text-[8px] font-bold ${UI.getPosClass(pStat.element_type)} px-0.5 rounded flex-shrink-0">${UI.getPosName(pStat.element_type)}</span>
                            </div>
                        </div>`;
                    } else {
                        return `
                        <div class="flex justify-between items-center py-1 border-b border-gray-700/40 ${isBench ? 'opacity-50' : ''}">
                            <div class="flex items-center truncate min-w-0 pr-1 w-full">
                                <span class="text-[8px] font-bold ${UI.getPosClass(pStat.element_type)} px-0.5 rounded mr-1.5 flex-shrink-0">${UI.getPosName(pStat.element_type)}</span>
                                <span class="text-[10px] font-semibold text-gray-200 truncate mr-1">${pStat.web_name || 'Unknown'}</span>
                                ${statBadges}
                                ${statusInd}
                            </div>
                            <div class="font-bold text-[11px] ${ptsColor} flex-shrink-0 w-4 text-right">${pts}</div>
                        </div>`;
                    }
                };

                h2hMatches.forEach((match, idx) => {
                    const t1 = State.entries[match.league_entry_1 || match.entry_1_entry];
                    const t2 = State.entries[match.league_entry_2 || match.entry_2_entry];
                    
                    if (!t1 || !t2) return;
                    
                    const t1Name = t1.player_first_name === "Rory" ? "Rory A" : t1.player_first_name;
                    const t2Name = t2.player_first_name === "Rory" ? "Rory A" : t2.player_first_name;

                    const t1Lineup = State.teamEvents[t1.entry_id];
                    const t2Lineup = State.teamEvents[t2.entry_id];

                    let detailsHtml = '<div class="p-3 text-center text-xs text-gray-500">Lineups not available</div>';
                    
                    if (t1Lineup && t2Lineup && t1Lineup.picks && t2Lineup.picks) {
                        const sortPicks = (a, b) => {
                            const statA = State.getStaticPlayer(a.element);
                            const statB = State.getStaticPlayer(b.element);
                            return statA.element_type - statB.element_type;
                        };
                        
                        const t1Starters = t1Lineup.picks.filter(p => p.position <= 11).sort(sortPicks);
                        const t1Bench = t1Lineup.picks.filter(p => p.position > 11).sort((a,b) => a.position - b.position);
                        
                        const t2Starters = t2Lineup.picks.filter(p => p.position <= 11).sort(sortPicks);
                        const t2Bench = t2Lineup.picks.filter(p => p.position > 11).sort((a,b) => a.position - b.position);

                        detailsHtml = `
                            <div class="flex p-2">
                                <div class="w-1/2 pr-1 border-r border-gray-700/50">
                                    <div class="text-[9px] text-gray-500 uppercase font-bold mb-1 tracking-wider">Starters</div>
                                    ${t1Starters.map(p => buildCondensedPlayer(p, false, false)).join('')}
                                    <div class="text-[9px] text-gray-500 uppercase font-bold mt-2 mb-1 tracking-wider text-right">Bench</div>
                                    ${t1Bench.map(p => buildCondensedPlayer(p, true, false)).join('')}
                                </div>
                                <div class="w-1/2 pl-1">
                                    <div class="text-[9px] text-gray-500 uppercase font-bold mb-1 tracking-wider text-right">Starters</div>
                                    ${t2Starters.map(p => buildCondensedPlayer(p, false, true)).join('')}
                                    <div class="text-[9px] text-gray-500 uppercase font-bold mt-2 mb-1 tracking-wider">Bench</div>
                                    ${t2Bench.map(p => buildCondensedPlayer(p, true, true)).join('')}
                                </div>
                            </div>
                        `;
                    }

                    listEl.innerHTML += `
                        <div class="bg-gray-800/90 rounded-xl shadow border border-gray-700/60 overflow-hidden cursor-pointer hover:bg-gray-750 transition-colors" onclick="document.getElementById('fixture-details-${idx}').classList.toggle('hidden'); this.querySelector('.chevron').classList.toggle('rotate-180')">
                            <div class="flex items-stretch h-16 relative">
                                <div class="absolute left-1/2 transform -translate-x-1/2 bottom-0.5 text-gray-600 chevron transition-transform duration-200">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                </div>
                                <div class="flex-1 flex flex-col justify-center px-3 min-w-0 ${t1.livePoints > t2.livePoints ? 'bg-emerald-950/30' : ''}">
                                    <div class="text-[10px] text-gray-400 truncate">${t1Name}</div>
                                    <div class="text-xs sm:text-sm font-bold truncate ${t1.livePoints > t2.livePoints ? 'text-emerald-400' : 'text-gray-200'}">${t1.entry_name}</div>
                                </div>
                                <div class="w-20 flex items-center justify-center bg-gray-900/40 border-x border-gray-700/50 flex-shrink-0 z-10">
                                    <div class="flex items-center space-x-1.5 font-bold">
                                        <span class="text-base ${t1.livePoints > t2.livePoints ? 'text-emerald-400' : 'text-gray-200'}">${t1.livePoints}</span>
                                        <span class="text-gray-600 text-xs">-</span>
                                        <span class="text-base ${t2.livePoints > t1.livePoints ? 'text-emerald-400' : 'text-gray-200'}">${t2.livePoints}</span>
                                    </div>
                                </div>
                                <div class="flex-1 flex flex-col justify-center px-3 text-right min-w-0 ${t2.livePoints > t1.livePoints ? 'bg-emerald-950/30' : ''}">
                                    <div class="text-[10px] text-gray-400 truncate">${t2Name}</div>
                                    <div class="text-xs sm:text-sm font-bold truncate ${t2.livePoints > t1.livePoints ? 'text-emerald-400' : 'text-gray-200'}">${t2.entry_name}</div>
                                </div>
                            </div>
                            <div id="fixture-details-${idx}" class="hidden bg-gray-900/60 border-t border-gray-700/60 shadow-inner">
                                ${detailsHtml}
                            </div>
                        </div>`;
                });
            },

            liveTable: () => {
                const tbody = document.getElementById('live-table-body');
                const thead = document.getElementById('live-table-head');
                tbody.innerHTML = '';

                const matches = State.leagueDetails.matches ? State.leagueDetails.matches.filter(m => m.event == State.currentGW) : [];
                const isH2H = matches.length > 0;
                
                if (isH2H) {
                    thead.innerHTML = `<tr><th class="px-3 py-2 text-center w-6">#</th><th class="px-1.5 py-2 text-center w-5"></th><th class="px-3 py-2">Team</th><th class="px-2.5 py-2 text-center">W-D-L</th><th class="px-2.5 py-2 text-center">Pts</th><th class="px-2.5 py-2 text-center bg-emerald-950/40 text-emerald-400 font-bold">H2H</th></tr>`;
                } else {
                    thead.innerHTML = `<tr><th class="px-3 py-2 text-center w-6">#</th><th class="px-1.5 py-2 text-center w-5"></th><th class="px-3 py-2">Team</th><th class="px-2.5 py-2 text-center">Total</th><th class="px-2.5 py-2 text-center bg-emerald-950/40 text-emerald-400 font-bold">Live</th></tr>`;
                }

                let liveH2H = {};
                matches.forEach(m => {
                    const entry1 = m.league_entry_1 || m.entry_1_entry;
                    const entry2 = m.league_entry_2 || m.entry_2_entry;
                    const p1 = State.entries[entry1]?.livePoints || 0;
                    const p2 = State.entries[entry2]?.livePoints || 0;
                    
                    liveH2H[entry1] = { pts: p1>p2 ? 3 : p1===p2 ? 1 : 0, w: p1>p2?1:0, d: p1===p2?1:0, l: p1<p2?1:0 };
                    liveH2H[entry2] = { pts: p2>p1 ? 3 : p1===p2 ? 1 : 0, w: p2>p1?1:0, d: p1===p2?1:0, l: p2<p1?1:0 };
                });

                let tableData = (State.leagueDetails.standings || []).map(s => {
                    const h2hUpdate = liveH2H[s.league_entry] || { pts: 0, w: 0, d: 0, l: 0 };
                    const livePts = State.entries[s.league_entry]?.livePoints || 0;
                    return {
                        ...s,
                        entryDetails: State.entries[s.league_entry],
                        liveFPLPts: livePts,
                        projectedH2HPts: (s.total || 0) + h2hUpdate.pts,
                        projectedTotalFPL: (s.points_for || s.total || 0) + livePts,
                        projectedW: (s.matches_won || 0) + h2hUpdate.w,
                        projectedD: (s.matches_drawn || 0) + h2hUpdate.d,
                        projectedL: (s.matches_lost || 0) + h2hUpdate.l
                    };
                });

                tableData.sort((a, b) => isH2H ? (b.projectedH2HPts - a.projectedH2HPts || b.projectedTotalFPL - a.projectedTotalFPL) : (b.projectedTotalFPL - a.projectedTotalFPL));

                tableData.forEach((team, idx) => {
                    const currentRank = idx + 1;
                    const prevRank = team.rank || 999;
                    let rankIcon = '<svg class="w-3.5 h-3.5 mx-auto text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path></svg>';
                    if (currentRank < prevRank) rankIcon = '<svg class="w-3.5 h-3.5 mx-auto arrow-up" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"></path></svg>';
                    else if (currentRank > prevRank) rankIcon = '<svg class="w-3.5 h-3.5 mx-auto arrow-down" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg>';

                    const rowClass = team.league_entry === State.myTeamId ? 'bg-emerald-950/20' : 'bg-gray-800/40';
                    const fName = team.entryDetails?.player_first_name === "Rory" ? "Rory A" : team.entryDetails?.player_first_name || '';

                    if(isH2H) {
                        tbody.innerHTML += `
                            <tr class="hover:bg-gray-700/30 transition-colors ${rowClass}">
                                <td class="px-3 py-2.5 text-center font-medium text-gray-400 text-xs">${currentRank}</td>
                                <td class="px-1.5 py-2.5 text-center">${rankIcon}</td>
                                <td class="px-3 py-2.5"><div class="text-xs font-bold text-gray-100 truncate max-w-[120px]">${team.entryDetails?.entry_name || 'Unknown'}</div><div class="text-[10px] text-gray-400">${fName}</div></td>
                                <td class="px-2.5 py-2.5 text-center text-xs text-gray-300 font-mono">${team.projectedW}-${team.projectedD}-${team.projectedL}</td>
                                <td class="px-2.5 py-2.5 text-center text-xs font-semibold text-gray-300">${team.projectedTotalFPL}</td>
                                <td class="px-2.5 py-2.5 text-center text-xs font-bold text-emerald-400 bg-emerald-950/30">${team.projectedH2HPts}</td>
                            </tr>`;
                    } else {
                        tbody.innerHTML += `
                            <tr class="hover:bg-gray-700/30 transition-colors ${rowClass}">
                                <td class="px-3 py-2.5 text-center font-medium text-gray-400 text-xs">${currentRank}</td>
                                <td class="px-1.5 py-2.5 text-center">${rankIcon}</td>
                                <td class="px-3 py-2.5"><div class="text-xs font-bold text-gray-100 truncate max-w-[120px]">${team.entryDetails?.entry_name || 'Unknown'}</div><div class="text-[10px] text-gray-400">${fName}</div></td>
                                <td class="px-2.5 py-2.5 text-center text-xs text-gray-300">${team.projectedTotalFPL}</td>
                                <td class="px-2.5 py-2.5 text-center text-xs font-bold text-emerald-400 bg-emerald-950/30">${team.liveFPLPts}</td>
                            </tr>`;
                    }
                });
            }
        };

        const MockData = {
            getBootstrap: () => ({ 
                events: [{ id: 1, is_current: true }], 
                teams: [{id: 1, short_name: "ARS"}, {id: 2, short_name: "AVL"}, {id: 3, short_name: "BOU"}, {id: 4, short_name: "BRE"}, {id: 5, short_name: "BHA"}, {id: 6, short_name: "CFC"}], 
                elements: [
                    { id: 1, web_name: "Saka", element_type: 3, team: 1 },
                    { id: 2, web_name: "Odegaard", element_type: 3, team: 1 },
                    { id: 3, web_name: "Watkins", element_type: 4, team: 2 },
                    { id: 4, web_name: "Haaland", element_type: 4, team: 5 },
                    { id: 5, web_name: "Palmer", element_type: 3, team: 6 },
                    { id: 6, web_name: "Raya", element_type: 1, team: 1 },
                    { id: 7, web_name: "Saliba", element_type: 2, team: 1 },
                    { id: 8, web_name: "Porro", element_type: 2, team: 3 },
                    { id: 9, web_name: "Trent", element_type: 2, team: 4 },
                    { id: 10, web_name: "Eze", element_type: 3, team: 5 },
                    { id: 11, web_name: "Mbeumo", element_type: 3, team: 4 },
                    { id: 12, web_name: "Pickford", element_type: 1, team: 2 },
                    { id: 13, web_name: "Trippier", element_type: 2, team: 6 },
                    { id: 14, web_name: "Solanke", element_type: 4, team: 3 },
                    { id: 15, web_name: "Gordon", element_type: 3, team: 6 }
                ] 
            }),
            getLeague: () => ({ 
                league: { name: "Mock Draft League" }, 
                league_entries: [
                    { id: 101, entry_id: 101, entry_name: "Lads on Toure", player_first_name: "John", player_last_name: "Doe" },
                    { id: 102, entry_id: 102, entry_name: "Saka Potatoes", player_first_name: "Jane", player_last_name: "Smith" },
                    { id: 103, entry_id: 103, entry_name: "Pique Blinders", player_first_name: "Mike", player_last_name: "Jones" },
                    { id: 104, entry_id: 104, entry_name: "Alisson Wonderland", player_first_name: "Sarah", player_last_name: "Lee" }
                ], 
                standings: [
                    { league_entry: 101, rank: 2, total: 200, points_for: 3500, matches_won: 10, matches_drawn: 2, matches_lost: 4 },
                    { league_entry: 102, rank: 1, total: 205, points_for: 3600, matches_won: 11, matches_drawn: 0, matches_lost: 5 },
                    { league_entry: 103, rank: 3, total: 195, points_for: 3400, matches_won: 9, matches_drawn: 1, matches_lost: 6 },
                    { league_entry: 104, rank: 4, total: 180, points_for: 3200, matches_won: 7, matches_drawn: 0, matches_lost: 9 }
                ], 
                matches: [
                    { event: 1, league_entry_1: 101, league_entry_2: 102 },
                    { event: 1, league_entry_1: 103, league_entry_2: 104 }
                ] 
            }),
            getPLFixtures: () => ([
                { team_h: 1, team_a: 2, started: true, finished: false },
                { team_h: 3, team_a: 4, started: true, finished: true },
                { team_h: 5, team_a: 6, started: false, finished: false }
            ]),
            getTeamEvent: (id) => {
                if (id === 101) return { picks: [ { element: 6, position: 1 }, { element: 7, position: 2 }, { element: 8, position: 3 }, { element: 9, position: 4 }, { element: 1, position: 5 }, { element: 2, position: 6 }, { element: 5, position: 7 }, { element: 10, position: 8 }, { element: 11, position: 9 }, { element: 3, position: 10 }, { element: 4, position: 11 }, { element: 12, position: 12 }, { element: 13, position: 13 }, { element: 15, position: 14 }, { element: 14, position: 15 } ] };
                return { picks: [ { element: 4, position: 1 }, { element: 1, position: 2 } ] };
            },
            getLiveScores: () => ({ 
                elements: {
                    1: { stats: { total_points: 8, minutes: 90, goals_scored: 1 } },
                    2: { stats: { total_points: 5, minutes: 75, assists: 1 } },
                    3: { stats: { total_points: 12, minutes: 90, goals_scored: 2 } },
                    4: { stats: { total_points: 17, minutes: 90, goals_scored: 3, assists: 1 } },
                    5: { stats: { total_points: 8, minutes: 90, yellow_cards: 1, bonus: 2 } },
                    6: { stats: { total_points: 6, minutes: 90, clean_sheets: 1 } },
                    7: { stats: { total_points: 6, minutes: 90, clean_sheets: 1 } },
                    8: { stats: { total_points: 2, minutes: 90 } },
                    9: { stats: { total_points: 9, minutes: 90, clean_sheets: 1, assists: 1, bonus: 1 } },
                    10: { stats: { total_points: 0, minutes: 0 } },
                    11: { stats: { total_points: 5, minutes: 60, goals_scored: 1 } },
                    12: { stats: { total_points: 3, minutes: 90, saves: 4 } },
                    13: { stats: { total_points: 0, minutes: 0 } },
                    14: { stats: { total_points: 5, minutes: 90 } },
                    15: { stats: { total_points: 0, minutes: 0 } }
                } 
            })
        };

        let touchstartY = 0;
        let touchendY = 0;
        const mainContainer = document.getElementById('main-scroll-container');
        const ptrEl = document.getElementById('ptr-element');

        mainContainer.addEventListener('touchstart', e => {
            touchstartY = e.changedTouches[0].screenY;
        }, {passive: true});

        mainContainer.addEventListener('touchmove', e => {
            touchendY = e.changedTouches[0].screenY;
            if (mainContainer.scrollTop === 0 && touchendY > touchstartY) {
                const pullDist = Math.min(touchendY - touchstartY, 120);
                ptrEl.style.transform = `translateY(${pullDist}px)`;
                ptrEl.style.opacity = `${pullDist / 80}`;
                if (pullDist > 70) {
                    document.getElementById('ptr-text').innerText = 'Release to refresh';
                }
            }
        }, {passive: true});

        mainContainer.addEventListener('touchend', e => {
            touchendY = e.changedTouches[0].screenY;
            if (mainContainer.scrollTop === 0 && (touchendY - touchstartY) > 70) {
                ptrEl.style.transform = `translateY(56px)`;
                document.getElementById('ptr-text').innerText = 'Refreshing...';
                API.refreshData(true).then(() => {
                    ptrEl.style.transform = `translateY(0px)`;
                    ptrEl.style.opacity = '0';
                    document.getElementById('ptr-text').innerText = 'Pull down to refresh...';
                });
            } else {
                ptrEl.style.transform = `translateY(0px)`;
                ptrEl.style.opacity = '0';
            }
        }, {passive: true});

        window.onload = API.init;
    </script>
</body>
</html>
